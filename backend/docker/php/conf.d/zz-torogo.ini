; ============================================================================
;  ToroGo - Configuracion de PHP
;  Se copia a /usr/local/etc/php/conf.d/ al construir la imagen.
; ============================================================================

; --- Zona horaria de El Salvador (UTC-6) ---
date.timezone = America/El_Salvador

; --- Limites de subida (fotos de platos, comprobantes) ---
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 120

; --- OPcache ---
; En desarrollo validamos los archivos en CADA peticion (revalidate_freq=0)
; para que veas tus cambios al instante. En produccion se cambia.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000

; --- Errores visibles en desarrollo (Laravel los captura igual) ---
display_errors = Off
log_errors = On
error_reporting = E_ALL
