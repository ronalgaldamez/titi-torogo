# ============================================================================
#  ToroGo - Configuracion de Nginx
#  "app" es el nombre del servicio PHP-FPM en docker-compose.yml.
#  Dentro de la red de Docker, los contenedores se resuelven por su nombre.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64M;

    # --- Laravel: todo pasa por index.php ---
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- PHP-FPM ---
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_hide_header X-Powered-By;
    }

    # --- Silenciar ruido en los logs ---
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # --- Bloquear archivos ocultos (.env, .git, etc.) ---
    # Excepcion: /.well-known (necesario para certificados SSL mas adelante)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
